<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgy - Control Proyectado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 p-4 md:p-8 font-sans">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center border-b pb-4 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">📊 Budgy</h1>
                <p class="text-slate-500 text-sm">Sincronizado con la nube</p>
            </div>
            <div class="flex items-center gap-3">
                <select id="mesSelector" onchange="cambiarMes()" class="p-2 rounded-lg border bg-white font-bold text-slate-700 shadow-sm outline-none"></select>
                <button onclick="aplicarPlantilla()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md hover:bg-indigo-700 transition">✨ Cargar Plantilla</button>
                <button onclick="limpiarTodo()" class="text-xs text-red-500 hover:underline">Reiniciar</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-blue-600 p-6 rounded-2xl shadow-xl text-center text-white">
                    <p class="text-[10px] uppercase font-black tracking-widest opacity-80">Gasto Semanal Libre</p>
                    <p id="semanalLibre" class="text-5xl font-black my-2">$0.00</p>
                    <p class="text-[11px] leading-tight opacity-90">Dinero disponible por semana tras gastos fijos y ahorros.</p>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-sm border-t-4 border-emerald-500">
                    <h3 class="font-bold text-slate-700 mb-4 text-sm uppercase">➕ Ingreso</h3>
                    <input type="text" id="inDesc" placeholder="Sueldo..." class="w-full border p-2 mb-2 rounded-lg text-sm outline-none">
                    <input type="number" id="inMonto" placeholder="Monto $" class="w-full border p-2 mb-2 rounded-lg text-sm outline-none">
                    <button onclick="addMovimiento('ingreso')" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold hover:bg-emerald-700">Añadir</button>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-sm border-t-4 border-slate-800">
                    <h3 class="font-bold text-slate-700 mb-4 text-sm uppercase">➖ Gasto / Planificación</h3>
                    <div class="space-y-3">
                        <input type="text" id="exDesc" placeholder="Descripción..." class="w-full border p-2 rounded-lg text-sm outline-none">
                        <input type="number" id="exMonto" placeholder="Monto $" class="w-full border p-2 rounded-lg text-sm outline-none">
                        <select id="exTipo" class="w-full border p-2 rounded-lg text-sm bg-slate-50 outline-none">
                            <option value="fijo">1. Fijo Mensual</option>
                            <option value="esencial">2. Esencial Irregular</option>
                            <option value="variable">3. Deseo / Ocio</option>
                            <option value="ahorro">4. Ahorro (Bolsos)</option>
                            <option value="deuda">5. Pago de Deuda</option>
                        </select>
                        <div class="flex items-center gap-2 p-2 bg-amber-50 rounded-lg border border-amber-200">
                            <input type="checkbox" id="esPendiente" class="w-4 h-4" checked>
                            <label class="text-xs font-medium text-amber-800 cursor-pointer">Aún no lo pago (Planificado)</label>
                        </div>
                        <button onclick="addMovimiento('egreso')" class="w-full bg-slate-800 text-white py-2 rounded-lg font-bold hover:bg-slate-900">Registrar</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm text-center">
                        <p class="text-[10px] text-slate-400 uppercase font-bold">Ingresos</p>
                        <p id="totalIn" class="text-xl font-bold text-emerald-600">$0.00</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm text-center border-b-4 border-amber-400">
                        <p class="text-[10px] text-slate-400 uppercase font-bold">Pendiente</p>
                        <p id="totalPen" class="text-xl font-bold text-amber-500">$0.00</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-sm text-center">
                        <p class="text-[10px] text-slate-400 uppercase font-bold">Gastado</p>
                        <p id="totalEx" class="text-xl font-bold text-slate-600">$0.00</p>
                    </div>
                    <div id="saldoCard" class="bg-slate-800 p-4 rounded-xl shadow-sm text-center">
                        <p class="text-[10px] text-slate-300 uppercase font-bold">Saldo Final</p>
                        <p id="totalNet" class="text-xl font-bold text-white">$0.00</p>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="p-3 text-slate-400 font-medium">Estado</th>
                                <th class="p-3 text-slate-400 font-medium">Descripción</th>
                                <th class="p-3 text-right text-slate-400 font-medium">Monto</th>
                                <th class="p-3"></th>
                            </tr>
                        </thead>
                        <tbody id="movementsTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Estructura robusta para evitar errores de Object.keys
        let store = { 
            meses: {}, 
            plantilla: [
                { desc: "Sueldo Cykadas", monto: 1000, tipo: "ingreso" },
                { desc: "Carnes", monto: 70, tipo: "fijo" },
                { desc: "Víveres", monto: 70, tipo: "fijo" },
                { desc: "Internet", monto: 30, tipo: "fijo" },
                { desc: "Bolso Efectivo", monto: 250, tipo: "ahorro" },
                { desc: "Bolso Euro", monto: 85, tipo: "ahorro" },
                { desc: "Cuota laptop", monto: 50, tipo: "deuda" }
            ]
        };
        
        let mesActual = new Date().toISOString().slice(0, 7);

        async function init() {
            try {
                const res = await fetch('/api/db');
                if (!res.ok) throw new Error("Error en servidor");
                
                const data = await res.json();
                
                // Validación para evitar el error de 'undefined' que tenías en consola
                if (data && data.meses) {
                    store = data;
                } else {
                    console.log("Iniciando con datos locales...");
                    const local = localStorage.getItem('budgy_backup');
                    if (local) store = JSON.parse(local);
                }

                generarSelectMeses();
                updateUI();
            } catch (e) { 
                console.error("Modo local activado:", e);
                generarSelectMeses();
                updateUI();
            }
        }

        function generarSelectMeses() {
            const selector = document.getElementById('mesSelector');
            if (!store.meses) store.meses = {};
            
            const meses = Object.keys(store.meses);
            if (!meses.includes(mesActual)) meses.push(mesActual);
            
            selector.innerHTML = meses.sort().reverse().map(m => 
                `<option value="${m}" ${m === mesActual ? 'selected' : ''}>${m}</option>`
            ).join('');
        }

        function cambiarMes() { 
            mesActual = document.getElementById('mesSelector').value; 
            updateUI(); 
        }

        async function updateUI() {
            if (!store.meses[mesActual]) store.meses[mesActual] = [];
            const list = store.meses[mesActual];

            // Cálculos principales
            const sumIn = list.filter(m => m.tipo === 'ingreso').reduce((a, b) => a + b.monto, 0);
            const egresos = list.filter(m => m.tipo !== 'ingreso' && m.estado === 'pagado').reduce((a, b) => a + b.monto, 0);
            const pendientes = list.filter(m => m.tipo !== 'ingreso' && m.estado === 'pendiente').reduce((a, b) => a + b.monto, 0);
            
            const balanceNeto = sumIn - egresos - pendientes;

            // Cálculo semanal (Ingresos - Gastos Fijos/Ahorros/Deudas) / 4
            const comprometido = list.filter(m => ['fijo', 'ahorro', 'deuda'].includes(m.tipo)).reduce((a, b) => a + b.monto, 0);
            const semanal = (sumIn - comprometido) > 0 ? ((sumIn - comprometido) / 4) : 0;

            document.getElementById('totalIn').innerText = `$${sumIn.toFixed(2)}`;
            document.getElementById('totalEx').innerText = `$${egresos.toFixed(2)}`;
            document.getElementById('totalPen').innerText = `$${pendientes.toFixed(2)}`;
            document.getElementById('totalNet').innerText = `$${balanceNeto.toFixed(2)}`;
            document.getElementById('semanalLibre').innerText = `$${semanal.toFixed(2)}`;

            renderTable(list);

            // Guardado automático en la nube y local
            localStorage.setItem('budgy_backup', JSON.stringify(store));
            
            try {
                await fetch('/api/db', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(store)
                });
            } catch (e) {
                console.warn("No se pudo sincronizar con la nube.");
            }
        }

        function addMovimiento(mode) {
            const desc = document.getElementById(mode === 'ingreso' ? 'inDesc' : 'exDesc').value;
            const monto = parseFloat(document.getElementById(mode === 'ingreso' ? 'inMonto' : 'exMonto').value);
            if (!desc || isNaN(monto)) return alert("Completa los datos");

            store.meses[mesActual].push({
                id: Date.now(),
                desc,
                monto,
                tipo: mode === 'egreso' ? document.getElementById('exTipo').value : 'ingreso',
                estado: mode === 'egreso' && document.getElementById('esPendiente').checked ? 'pendiente' : 'pagado'
            });
            
            // Limpiar inputs
            document.getElementById(mode === 'ingreso' ? 'inDesc' : 'exDesc').value = '';
            document.getElementById(mode === 'ingreso' ? 'inMonto' : 'exMonto').value = '';
            updateUI();
        }

        function aplicarPlantilla() {
            if (!store.meses[mesActual]) store.meses[mesActual] = [];
            store.plantilla.forEach(item => {
                store.meses[mesActual].push({ 
                    ...item, 
                    id: Date.now() + Math.random(), 
                    estado: item.tipo === 'ingreso' ? 'pagado' : 'pendiente' 
                });
            });
            updateUI();
        }

        function renderTable(list) {
            const table = document.getElementById('movementsTable');
            table.innerHTML = list.slice().reverse().map(m => `
                <tr class="border-b hover:bg-slate-50 transition">
                    <td class="p-3 cursor-pointer" onclick="toggleEstado(${m.id})">
                        ${m.estado === 'pagado' ? '<span class="text-emerald-500">✔️</span>' : '<span class="text-amber-500">🕒</span>'}
                    </td>
                    <td class="p-3 ${m.estado === 'pagado' && m.tipo !== 'ingreso' ? 'line-through text-slate-400' : 'text-slate-700'}">
                        ${m.desc}
                    </td>
                    <td class="p-3 text-right font-bold ${m.tipo === 'ingreso' ? 'text-emerald-600' : 'text-slate-700'}">
                        $${m.monto.toFixed(2)}
                    </td>
                    <td class="p-3 text-center cursor-pointer text-slate-300 hover:text-red-500" onclick="deleteItem(${m.id})">
                        🗑️
                    </td>
                </tr>
            `).join('');
        }

        function toggleEstado(id) {
            const item = store.meses[mesActual].find(m => m.id === id);
            if (item && item.tipo !== 'ingreso') {
                item.estado = item.estado === 'pagado' ? 'pendiente' : 'pagado';
                updateUI();
            }
        }

        function deleteItem(id) {
            if (confirm("¿Eliminar registro?")) {
                store.meses[mesActual] = store.meses[mesActual].filter(m => m.id !== id);
                updateUI();
            }
        }

        function limpiarTodo() {
            if (confirm("¿Borrar todos los datos del mes?")) {
                store.meses[mesActual] = [];
                updateUI();
            }
        }

        init();
    </script>
</body>
</html>
